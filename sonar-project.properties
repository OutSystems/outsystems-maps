# SonarCloud connection settings
sonar.host.url=https://sonarcloud.io
sonar.organization=outsystemsrd

# Required: Unique project key (usually org_repo format)
sonar.projectKey=OutSystems_outsystems-maps

# Project name displayed in SonarCloud
sonar.projectName=OutSystems Maps

# Source code location
sonar.sources=src

# Exclude files from analysis (optional)
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.min.js

# JavaScript/TypeScript settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Suppress S7764 (prefer globalThis over window) project-wide.
# Runtime-injected browser globals are declared via `interface Window` augmentation
# in Global.d.ts — `window.x` is the only access pattern TypeScript resolves correctly.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=*:S7764
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.ts